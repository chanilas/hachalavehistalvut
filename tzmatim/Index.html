<title>צמתים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: playful planning board – a colorful header with four subject dots meeting in a "junction", tabs, then roomy cards per coordinator. */
:root {
  --bg: #F6F5FF;
  --surface: #FFFFFF;
  --ink: #2B2550;
  --muted: #6E6890;
  --line: #E4E1F4;
  --soft: #EEECFB;

  --kodesh: #F2A31B;
  --hebrew: #EC4F86;
  --english: #4F86EE;
  --math: #1FAE78;

  --cur: #FF7A3D;
  --skl: #8C5CF0;
  --dist: #2B2550;

  --h1: #FF7A3D;
  --h2: #F2A31B;
  --h3: #EC4F86;
  --h4: #8C5CF0;

  --ok: #1FAE78;
  --warn: #F2A31B;
  --bad: #E5484D;

  --display: "Fredoka", "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --body: "Assistant", "Arial Hebrew", system-ui, sans-serif;

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --shadow: 0 1px 0 rgba(43,37,80,.04), 0 8px 24px -12px rgba(43,37,80,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15132A; --surface: #211E3C; --ink: #F2F0FF; --muted: #ABA6CF; --line: #36325C; --soft: #2A2649;
    --kodesh: #F7B544; --hebrew: #F46C9C; --english: #6E9CF5; --math: #3CC690;
    --cur: #FF9058; --skl: #A27DF7; --dist: #CFCAF5; --h1: #FF9058; --h2: #F7B544; --h3: #F46C9C; --h4: #A27DF7;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 28px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15132A; --surface: #211E3C; --ink: #F2F0FF; --muted: #ABA6CF; --line: #36325C; --soft: #2A2649;
  --kodesh: #F7B544; --hebrew: #F46C9C; --english: #6E9CF5; --math: #3CC690;
  --cur: #FF9058; --skl: #A27DF7; --dist: #CFCAF5; --h1: #FF9058; --h2: #F7B544; --h3: #F46C9C; --h4: #A27DF7;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55; direction: rtl;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--skl) 60%, transparent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2; }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.hero { padding-block: 28px 8px; }
.hero-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.logo { width: 64px; height: 64px; flex: none; }
.brand h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -.5px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 1.02rem; }
.anchors { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.anchor {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .95rem;
}
.anchor .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.anchor .ic svg { width: 16px; height: 16px; }
.demo-note {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 14px; padding: 10px 14px; border-radius: var(--r-md); font-size: .92rem;
  background: color-mix(in srgb, var(--kodesh) 16%, var(--surface)); border: 1px dashed var(--kodesh);
}

/* ---------- tabs ---------- */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 14px 10px; margin-top: 10px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabbar { display: flex; gap: 6px; padding: 5px; background: var(--soft); border-radius: 999px; width: max-content; max-width: 100%; overflow-x: auto; }
.tab {
  border: 0; background: transparent; padding: 9px 18px; border-radius: 999px; font-weight: 700;
  color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tab svg { width: 16px; height: 16px; }
.sync { font-size: .82rem; color: var(--muted); margin-inline-start: auto; }
.tabs .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

main { padding-block: 10px 60px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 12px; }
.section-title h2 { font-size: 1.45rem; }
.section-title .hint { color: var(--muted); font-size: .93rem; }

/* ---------- coordinator picker ---------- */
.pick-intro { font-size: 1.1rem; color: var(--muted); margin: 18px 0 14px; }
.coord-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.coord-card {
  --c: var(--ink);
  text-align: start; border: 0; border-radius: var(--r-lg); padding: 20px 20px 18px; min-height: 150px;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--ink);
  display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
}
.coord-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.coord-card .blob { position: absolute; inset-inline-end: -28px; top: -28px; width: 110px; height: 110px; border-radius: 50%; background: var(--c); opacity: .9; }
.coord-card h3 { font-size: 1.5rem; position: relative; }
.coord-card .meta { color: var(--muted); font-size: .92rem; position: relative; }
.coord-card .mini-req { display: flex; gap: 6px; margin-top: auto; position: relative; flex-wrap: wrap; }

/* ---------- requirement chips ---------- */
.req { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.req .dot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--surface); }
.req .dot svg { width: 10px; height: 10px; }
.req.done { color: var(--ink); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.req.done .dot { background: var(--ok); }

/* ---------- my plan ---------- */
.plan-head {
  --c: var(--ink);
  margin-top: 16px; border-radius: var(--r-lg); padding: 22px; background: color-mix(in srgb, var(--c) 15%, var(--surface));
  display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; position: relative; overflow: hidden;
}
.plan-head .who { display: flex; align-items: center; gap: 14px; }
.plan-head .badge { width: 56px; height: 56px; border-radius: 18px; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 1.6rem; font-weight: 700; flex: none; }
.plan-head h2 { font-size: 1.8rem; }
.plan-head .switch { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: .92rem; }
.meter { display: flex; flex-wrap: wrap; gap: 8px; }
.meter .req { font-size: .9rem; padding: 6px 12px 6px 14px; }

.team { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.person button { border: 0; background: var(--soft); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; }
.person button svg { width: 10px; height: 10px; }
.add-person { display: inline-flex; gap: 6px; }
.add-person input { border: 1px dashed var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; width: 170px; max-width: 100%; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative;
}
.card h3 { font-size: 1.12rem; }
.card .desc { color: var(--muted); font-size: .95rem; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
.card .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: .9rem; margin: 0; }
.card .facts dt { color: var(--muted); }
.card .facts dd { margin: 0; overflow-wrap: anywhere; }
.card .owner { position: absolute; top: 14px; inset-inline-end: 14px; width: 12px; height: 12px; border-radius: 50%; }
.card.clickable { cursor: pointer; transition: box-shadow .15s, transform .15s; }
.card.clickable:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

.goal-list { display: flex; flex-direction: column; gap: 16px; }
.goal-group { --c: var(--muted); border-radius: var(--r-lg); padding: 18px; background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 25%, var(--line)); display: flex; flex-direction: column; gap: 14px; }
.goal-group.orphan { border-style: dashed; background: transparent; }
.goal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.goal-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 280px; }
.goal-main h3 { font-size: 1.3rem; }
.goal-main .desc { color: var(--muted); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.goal-group .add-card { min-height: 100px; background: var(--surface); }
.add-goal { min-height: 80px; }
.card.district {
  border: 2px solid var(--dist);
  background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--dist) 14%, transparent) 1px, transparent 1.5px) 0 0 / 14px 14px,
    var(--surface);
}
.lock { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--dist); text-transform: none; letter-spacing: .3px; }
.lock svg { width: 13px; height: 13px; }

.add-card {
  border: 2px dashed var(--line); background: transparent; border-radius: var(--r-lg); min-height: 120px;
  display: grid; place-items: center; color: var(--muted); font-weight: 700; font-size: 1rem; padding: 18px;
}
.add-card:hover { border-color: var(--skl); color: var(--ink); }
.add-card span { display: flex; align-items: center; gap: 8px; }
.add-card svg { width: 20px; height: 20px; }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }
.pill.tag-curiosity { background: color-mix(in srgb, var(--cur) 18%, var(--surface)); color: color-mix(in srgb, var(--cur) 75%, var(--ink)); }
.pill.tag-skills { background: color-mix(in srgb, var(--skl) 18%, var(--surface)); color: color-mix(in srgb, var(--skl) 75%, var(--ink)); }
.pill.tag-subject { background: color-mix(in srgb, var(--c, var(--muted)) 18%, var(--surface)); color: color-mix(in srgb, var(--c, var(--muted)) 70%, var(--ink)); }
.pill.grade { background: var(--soft); color: var(--ink); }
.pill.st-planned { background: var(--soft); color: var(--muted); }
.pill.st-active { background: color-mix(in srgb, var(--english) 18%, var(--surface)); color: color-mix(in srgb, var(--english) 70%, var(--ink)); }
.pill.st-done { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); color: color-mix(in srgb, var(--ok) 65%, var(--ink)); }
.pill.st-stuck { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: color-mix(in srgb, var(--bad) 75%, var(--ink)); }
.pill.when { background: transparent; border: 1px solid var(--line); color: var(--muted); }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); }
.btn.small { padding: 6px 14px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- board ---------- */
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.grade-pick { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
.grade-btn {
  width: 52px; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--display); font-size: 1.35rem; font-weight: 600; display: grid; place-items: center; position: relative;
}
.grade-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grade-btn .n { position: absolute; top: -6px; inset-inline-start: -6px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--cur); color: #fff; font-family: var(--body); font-size: .72rem; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.lane { --c: var(--ink); border-radius: var(--r-lg); background: color-mix(in srgb, var(--c) 10%, var(--surface)); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lane > header { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.lane > header i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.lane .card { padding: 14px; gap: 8px; border-radius: var(--r-md); }
.lane .card h3 { font-size: 1rem; }
.lane .empty { color: var(--muted); font-size: .9rem; padding: 6px 2px; }
.kind { font-size: .75rem; font-weight: 700; color: var(--muted); letter-spacing: .3px; }

.timeline-scroll { overflow-x: auto; margin-top: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.timeline { display: grid; grid-template-columns: 120px repeat(12, minmax(78px, 1fr)); min-width: 1060px; }
.timeline .mh { font-family: var(--display); font-weight: 600; font-size: .9rem; text-align: center; padding: 12px 4px; border-bottom: 1px solid var(--line); color: var(--muted); }
.timeline .mh.adar { color: var(--ink); }
.timeline .lh { padding: 12px; font-family: var(--display); font-weight: 600; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); position: sticky; inset-inline-start: 0; background: var(--surface); z-index: 1; }
.timeline .lh i { width: 12px; height: 12px; border-radius: 50%; }
.timeline .track { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(12, minmax(78px, 1fr)); grid-auto-rows: minmax(34px, auto); gap: 6px 0; padding-block: 10px; border-top: 1px solid var(--line);
  background-image: linear-gradient(to left, var(--line) 1px, transparent 1px); background-size: calc(100% / 12) 100%; }
.bar { margin: 0 3px; border-radius: 10px; padding: 5px 10px; font-size: .84rem; font-weight: 700; color: #fff; border: 0; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.bar.district { background: var(--dist); color: var(--bg); }
.bar .tg { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex: none; }
.bar .tg.cur { background: var(--cur); box-shadow: 0 0 0 2px #fff; }
.bar .tg.skl { background: var(--skl); box-shadow: 0 0 0 2px #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--muted); font-size: .86rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.link-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.link-card .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.link-card .side { --c: var(--ink); background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-radius: var(--r-md); padding: 10px; min-width: 0; }
.link-card .side b { display: block; font-size: .78rem; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
.link-card .side span { font-weight: 700; font-size: .95rem; overflow-wrap: anywhere; }
.link-card .knot { width: 30px; height: 30px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; color: var(--muted); }
.link-card .knot svg { width: 16px; height: 16px; }
.link-card .why { font-size: .9rem; color: var(--muted); }

/* ---------- admin ---------- */
.gate { max-width: 420px; margin: 40px auto; background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line); padding: 26px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.gate input { text-align: center; font-size: 1.3rem; letter-spacing: 6px; padding: 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg); }
.gate .err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.stat b { display: block; font-family: var(--display); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { color: var(--muted); font-size: .9rem; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .93rem; }
th, td { text-align: start; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 700; color: var(--muted); font-size: .84rem; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: center; }
.yes { color: var(--ok); font-weight: 700; }
.no { color: var(--bad); font-weight: 700; }
.needs { display: flex; flex-direction: column; gap: 8px; }
.need-row { display: grid; grid-template-columns: 160px 1fr 34px; gap: 10px; align-items: center; font-size: .93rem; }
.need-row .track2 { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.need-row .fill { height: 100%; border-radius: 999px; background: var(--skl); }
.need-row b { font-variant-numeric: tabular-nums; text-align: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.list-plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.list-plain li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, #0D0B1E 55%, transparent); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal {
  background: var(--surface); border-radius: 26px; width: min(760px, 100%); max-height: calc(100% - 24px); overflow: auto;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.45);
}
.modal header { position: sticky; top: 0; background: var(--surface); padding: 20px 22px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 1; }
.modal header h2 { font-size: 1.35rem; }
.modal .x { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.modal .x svg { width: 14px; height: 14px; }
.modal form { padding: 18px 22px 8px; display: flex; flex-direction: column; gap: 18px; }
.modal footer { position: sticky; bottom: 0; background: var(--surface); padding: 12px 22px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field > .lbl { font-weight: 700; font-size: .95rem; }

      if (grp.hasAttribute('data-single')) grp.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', String(grp.hasAttribute('data-single') ? true : on));
      if (grp.getAttribute('data-chips') === 'grades') {
        var v = chip.getAttribute('data-val');
        if (v === 'all' && on) grp.querySelectorAll('.chip:not([data-val="all"])').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        if (v !== 'all' && on) grp.querySelector('[data-val="all"]').setAttribute('aria-pressed', 'false');
      }
      if (grp.getAttribute('data-chips') === 'tags') {
        var cf = document.getElementById('chvField');
        if (cf) cf.hidden = !grp.querySelector('[data-val="curiosity"][aria-pressed="true"]');
      }
      if (grp.getAttribute('data-chips') === 'chv') {
        var sg = document.querySelector('[data-chips="stages"]'), mode = chip.getAttribute('data-val');
        if (mode === 'none') sg.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        else if (!sg.querySelector('[aria-pressed="true"]')) sg.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', 'true'); });
      }
      return;
    }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'close-bg' && e.target !== el) return;
    switch (act) {
      case 'pick': state.coord = id; store('tzmatim-coord', id); render(); window.scrollTo(0, 0); break;
      case 'switch': state.coord = null; store('tzmatim-coord', ''); render(); break;
      case 'rm-teacher':
        var t = team(state.coord).slice(); t.splice(+el.getAttribute('data-i'), 1); saveTeam(state.coord, t); break;
      case 'new-goal': editGoal(null); break;
      case 'edit-goal': editGoal(state.data.goals.filter(function (x) { return x.id === id; })[0]); break;
      case 'new-action': editAction(null, el.getAttribute('data-goal')); break;
      case 'edit-action': editAction(state.data.actions.filter(function (x) { return x.id === id; })[0]); break;
      case 'edit-district': editDistrict(); break;
      case 'mode': state.boardMode = el.getAttribute('data-mode'); render(); break;
      case 'grade': state.boardGrade = el.getAttribute('data-g'); render(); break;
      case 'chavaya':
        state.modalOpen = true;
        modalRoot.innerHTML = '<div class="overlay" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
          '<header><h2 id="mTitle">מודל חוויה</h2><button class="x" data-act="close" aria-label="סגירה">' + icon('x') + '</button></header>' +
          '<div style="padding:18px 22px 22px">' + chavayaStrip() + '</div></div></div>';
        break;
      case 'peek': peek(el.getAttribute('data-type'), id, el.getAttribute('data-coord')); break;
      case 'demo-fill': case 'demo-clear':
        state.data = act === 'demo-fill' ? demoData() : { teams: [], goals: [], actions: [], district: [] };
        persistDemo(); render(); toast(act === 'demo-fill' ? 'נוספו דוגמאות' : 'הכול נוקה'); break;
      case 'logout': state.admin = false; render(); break;
      case 'close': case 'close-bg': closeModal(); break;
      case 'save':
        var form = document.getElementById('mForm'), res = modalRoot._save(form);
        if (res && typeof res === 'object') { var type = modalRoot._type; closeModal(); persist(type, res); }
        break;
      case 'delete':
        if (el.getAttribute('data-confirm') !== '1') { el.setAttribute('data-confirm', '1'); el.textContent = 'בטוח? לחצי שוב למחיקה'; break; }
        var d = modalRoot._delete(); closeModal();
        state.data[d.type] = state.data[d.type].filter(function (x) { return x.id !== d.id; });
        if (d.type === 'goals') state.data.actions.forEach(function (a) { a.goals = (a.goals || []).filter(function (g) { return g !== d.id; }); });
        render(); setSync('מוחקת…');
        api.remove(d.type, d.id).then(function () { setSync(IS_GAS ? 'נשמר' : 'נשמר בדפדפן הזה'); toast('נמחק'); })
          .catch(function () { setSync('המחיקה נכשלה'); toast('המחיקה לא הצליחה. נסי שוב.'); });
        break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.modalOpen) closeModal();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card.clickable')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.getAttribute('data-form');
    if (!f) return;
    e.preventDefault();
    if (f === 'teacher') {
      var inp = document.getElementById('newTeacher'), name = inp.value.trim();
      if (!name) return;
      var t = team(state.coord).slice();
      if (t.indexOf(name) < 0) t.push(name);
      saveTeam(state.coord, t);
      setTimeout(function () { var n = document.getElementById('newTeacher'); if (n) n.focus(); }, 0);
    }
    if (f === 'admin') {
      var code = document.getElementById('adminCode').value;
      api.checkAdmin(code).then(function (ok) {
        if (ok) { state.admin = true; render(); }
        else document.getElementById('adminErr').textContent = 'הקוד לא נכון. נסי שוב.';
      });
    }
  });

  // ---------- boot ----------
  function load(quiet) {
    if (!quiet) setSync('טוענת…');
    return api.getAll().then(function (d) {
      state.data = { teams: d.teams || [], goals: d.goals || [], actions: d.actions || [], district: d.district || [] };
      state.loaded = true;
      setSync(IS_GAS ? 'מעודכן' : 'תצוגה מקדימה');
      if (!state.modalOpen) render();
    }).catch(function (e) {
      state.loaded = true; setSync('לא הצלחתי לטעון'); render(); console.error(e);
    });
  }
  hydrateIcons(document);
  if (!IS_GAS) document.getElementById('demoNote').hidden = false;
  render();
  load();
  // רענון כל דקה, כדי לראות מה רכזות אחרות הוסיפו
  if (IS_GAS) setInterval(function () { if (!state.modalOpen && !document.hidden) load(true); }, 60000);
})();
</script>
